name: Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit flake8
      - name: Run bandit (always succeed)
        run: |
          set +e
          bandit -r . -f txt -o bandit_report.txt
          exit 0
      - name: Run flake8 (always succeed)
        run: |
          set +e
          flake8 . --count --statistics --show-source --max-line-length=120
          exit 0
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.txt

name: Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit flake8
      - name: Run bandit
        run: |
          python -m bandit -r . -f txt -o bandit_report.txt || echo "bandit found issues but continuing"
      - name: Run flake8
        run: |
          python -m flake8 . --count --statistics --show-source --max-line-length=120 || echo "flake8 found issues but continuing"
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            bandit_report.txt
